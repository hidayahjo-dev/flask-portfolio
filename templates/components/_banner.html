<header class="hero" id="top">
  <div class="container">
    <div class="row align-items-start gy-5">
      <div class="col-lg-6">
        <div class="terminal-window hero-intro-terminal" aria-hidden="false" role="img" aria-label="Terminal window with a self-introduction">
          <div class="terminal-titlebar">
            <span class="dot dot-red"></span>
            <span class="dot dot-yellow"></span>
            <span class="dot dot-green"></span>
            <span class="terminal-filename">about-me.sh</span>
          </div>
          <div class="terminal-body">
            <p class="terminal-line">
              <span class="prompt">$ whoami</span>
              <!--<span class="typewriter" data-text="cat self_intro.md"></span>-->
            </p>
            <!--<h1 class="hero-title">{{ site_name }} Hello1</h1>-->
            <p class="hero-subtitle">{{ about.headline }}</p>
            <p class="hero-bio terminal-output">{{ about.bio_hero }}</p>
            <!--<p class="terminal-line mt-2"><span class="prompt">$</span> <span class="cursor-blink">&#9608;</span></p>-->
          </div>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
          <a href="#projects" class="btn ide-btn-accent btn-lg">View Projects</a>
          <a href="#contact" class="btn ide-btn-outline btn-lg">Get In Touch</a>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="hero-portrait-wrap">
          <div class="hero-portrait-frame">
            <img
              src="{{ url_for('static', filename='img/profile.jpeg') }}"
              alt="Photo of {{ site_name }}"
              class="hero-portrait-img"
            >
            <span class="hero-portrait-corner corner-tl" aria-hidden="true"></span>
            <span class="hero-portrait-corner corner-br" aria-hidden="true"></span>
          </div>
          <!--<p class="hero-portrait-name">{{ site_name }}Hidayah Joha</p>-->
          <p class="hero-title">{{ site_name }}Hidayah Joha</p>
          <div class="hero-portrait-badge">
            <span class="badge-dot"></span> available for work
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

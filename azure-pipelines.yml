# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

jobs:

- job: CI
  displayName: 'Continuous Integration'
  pool:
    vmImage: ubuntu-latest

  steps:

  - script: |
      echo "Current directory:"
      pwd

      echo ""
      echo "Files in repository:"
      ls -la

      echo ""
      echo "Docker version:"
      docker --version
    displayName: 'Inspect Azure DevOps agent'

  - script: |
      python -m py_compile flask_app.py
    displayName: 'Validate Python Syntax'

  - script: |
      docker build -t nhidayah26/flask-webapp-demo:v1 .
    displayName: 'Build Docker Image'

  - task: Docker@2
    displayName: 'Push Docker Image to Docker Hub'
    inputs:
      command: push
      repository: nhidayah26/flask-webapp-demo
      tags: |
        v1
      containerRegistry: dockerhub-cicd


- job: CD
  displayName: 'Continuous Deployment'
  dependsOn: CI

  pool:
    name: minikube-local

  steps:

  - script: |
      echo "Current Kubernetes nodes:"
      kubectl get nodes

      echo ""
      echo "Checking MySQL secret..."
      kubectl get secret mysql-secret -n flask-webapp-demo

      echo ""
      echo "Deploying MySQL ConfigMap..."
      kubectl apply -f k8s/mysql-configmap.yaml

      echo ""
      echo "Deploying MySQL..."
      kubectl apply -f k8s/mysql-deployment.yaml

      echo ""
      echo "Deploying MySQL Service..."
      kubectl apply -f k8s/mysql-service.yaml

      echo ""
      echo "Waiting for MySQL rollout..."
      kubectl rollout status deployment/mysql -n flask-webapp-demo

      echo ""
      echo "Deploying Flask application..."
      kubectl apply -f k8s/flask-deployment.yaml

      echo ""
      echo "Deploying Flask service..."
      kubectl apply -f k8s/flask-service.yaml

      echo ""
      echo "Waiting for Flask rollout..."
      kubectl rollout status deployment/flask-deployment -n flask-webapp-demo

      echo ""
      echo "Final Kubernetes resources:"
      kubectl get pods -n flask-webapp-demo
      kubectl get services -n flask-webapp-demo

    displayName: 'Deploy to Minikube'
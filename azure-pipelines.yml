# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- script: |
    echo "Current directory:"
    pwd

    echo ""
    echo "Files in repository:"
    ls -la

    echo ""
    echo "Python version:"
    python3 --version
  displayName: 'Inspect Azure DevOps agent'

- script: |
    docker build -t nhidayah26/flask-app-cicd:v1 .
  displayName: 'Build Docker image'

- task: Docker@2
  displayName: "Push Docker Image to Docker Hub"
  inputs:
    command: push
    repository: nhidayah26/flask-app-cicd
    tags: |
      v1
    containerRegistry: dockerhub-cicd

    